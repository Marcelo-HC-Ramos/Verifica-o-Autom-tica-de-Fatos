<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificador de Fatos em PLN</title>
<style>
  :root {
    --navy: #1e2761;
    --ice: #cadcfc;
    --ink: #1e2761;
    --muted: #5a6478;
    --card: #eef2fa;
    --line: #d0d7e5;
    --verde: #2e7d32;
    --vermelho: #c62828;
    --cinza: #616161;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    background: var(--navy);
    color: var(--ink);
    min-height: 100vh;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }
  header h1 {
    color: #fff;
    font-size: 40px;
    margin: 0 0 8px;
  }
  header p {
    color: var(--ice);
    font-size: 18px;
    margin: 0 0 32px;
  }
  .painel {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }
  label {
    font-size: 16px;
    font-weight: bold;
    display: block;
    margin-bottom: 10px;
  }
  .entrada {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    font-size: 18px;
    font-family: inherit;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--navy);
  }
  button.verificar {
    font-size: 18px;
    font-family: inherit;
    font-weight: bold;
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    background: var(--navy);
    color: #fff;
    cursor: pointer;
  }
  button.verificar:hover { background: #2b3a80; }
  button.verificar:disabled { background: var(--cinza); cursor: wait; }
  .exemplos {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .exemplos button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .exemplos button:hover { border-color: var(--navy); }
  .resultado {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 22px;
    min-height: 120px;
  }
  .veredito {
    display: inline-block;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    padding: 8px 18px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .veredito.apoiada { background: var(--verde); }
  .veredito.refutada { background: var(--vermelho); }
  .veredito.sem { background: var(--cinza); }
  .detalhe {
    margin-top: 16px;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.5;
  }
  .detalhe strong { color: var(--ink); }
  .detalhe a { color: var(--navy); }
  .vazio {
    color: var(--muted);
    font-size: 16px;
  }
  .numeros {
    margin-top: 10px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    background: var(--card);
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--ink);
  }
  .aviso {
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
  }
  details {
    margin-top: 28px;
    color: var(--ice);
    font-size: 16px;
  }
  details summary {
    cursor: pointer;
    font-weight: bold;
  }
  details ul {
    padding-left: 20px;
    line-height: 1.7;
  }
  footer {
    margin-top: 28px;
    color: var(--ice);
    font-size: 14px;
    font-family: "Courier New", monospace;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Verificador de Fatos em PLN</h1>
    <p>Digite qualquer afirmação factual em português e veja se ela bate com as evidências.</p>
  </header>

  <section class="painel">
    <label for="afirmacao">Afirmação</label>
    <form id="form" class="entrada" autocomplete="off">
      <input type="text" id="afirmacao" placeholder="Ex.: O Brasil tem 27 estados." required>
      <button type="submit" class="verificar" id="botao">Verificar</button>
    </form>

    <div class="exemplos" id="exemplos"></div>

    <div class="resultado" id="resultado">
      <p class="vazio">Digite uma afirmação ou escolha um exemplo acima.</p>
    </div>
  </section>

  <details>
    <summary>Ver a base local de evidências (7 fatos)</summary>
    <ul id="base"></ul>
  </details>

  <footer>Processamento de Linguagem Natural · base local + Wikipédia (pt)</footer>
</main>

<script>
  // ---------- Base local (verificação rápida, sem internet) ----------
  const BASE = [
    "A capital do Brasil é Brasília.",
    "O Brasil tem 26 estados e um Distrito Federal.",
    "O rio Amazonas é o maior rio do mundo em volume de água.",
    "A Constituição brasileira atual foi promulgada em 1988.",
    "A Copa do Mundo de 2002 foi vencida pelo Brasil.",
    "O Brasil proclamou a independência em 1822.",
    "A língua oficial do Brasil é o português."
  ];

  const EXEMPLOS = [
    "Brasília é a capital do Brasil.",
    "O Brasil tem 27 estados.",
    "O Brasil conquistou a Copa do Mundo de 2002.",
    "A Alemanha é o país mais populoso da Europa.",
    "A cidade de São Paulo tem 12 milhões de habitantes.",
    "O Pará tem área maior que a Bahia."
  ];

  const WIKI_API = "https://pt.wikipedia.org/w/api.php";
  const WIKI_PAGINA = "https://pt.wikipedia.org/wiki/";

  // ---------- Texto e tokens ----------
  function normalizar(texto) {
    return texto.toLowerCase().normalize("NFD").replace(/\p{Mn}/gu, "");
  }

  const STOPWORDS = new Set(normalizar(
    "a o as os de da do das dos e em no na nos nas um uma uns umas que é foi são ser " +
    "tem têm por para com se ao aos à às mais seu sua seus suas pelo pela"
  ).split(/\s+/));

  function tokens(texto) {
    const palavras = normalizar(texto).match(/[a-z0-9]+/g) || [];
    return new Set(palavras.filter(p => !STOPWORDS.has(p)));
  }

  // ---------- Números (com escala: "12 milhões", "12.396.372", "11,4 milhões") ----------
  const ESCALAS = { mil: 1e3, milhao: 1e6, milhoes: 1e6, bilhao: 1e9, bilhoes: 1e9 };

  function prepararNumeros(texto) {
    // Une grupos de milhar separados por espaço: "12 396 372" -> "12396372"
    return texto.replace(/(\d)[\s  ](?=\d{3}(?!\d))/g, "$1");
  }

  function extrairNumeros(texto) {
    const t = prepararNumeros(texto);
    const re = /(\d+(?:[.,]\d+)*)(?:\s*(milh[õo]es|milh[ãa]o|bilh[õo]es|bilh[ãa]o|mil)\b)?/gi;
    const achados = [];
    let m;
    while ((m = re.exec(t)) !== null) {
      let s = m[1];
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");   // 12.396.372
      else if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); // 11,4
      let valor = parseFloat(s);
      const escala = m[2] ? ESCALAS[normalizar(m[2])] : undefined;
      // Casas decimais escritas: "11,4" tem 1; "12" tem 0
      const casas = (s.split(".")[1] || "").length;
      let unidade = 1;
      if (escala) {
        valor *= escala;
        unidade = Math.pow(10, -casas) * escala;
      }
      if (!isNaN(valor)) achados.push({ valor, escala: !!escala, unidade });
    }
    return achados;
  }

  function numeroBate(afirmado, encontrado) {
    // Sem escala (anos, contagens): tem que ser exatamente igual
    if (!afirmado.escala) return afirmado.valor === encontrado.valor;
    // Com escala: vale o arredondamento do que foi escrito.
    // "12 milhões" aceita de 11,5 a 12,5 milhões; "11,4 milhões" aceita de 11,35 a 11,45.
    const meio = afirmado.unidade / 2;
    return encontrado.valor >= afirmado.valor - meio && encontrado.valor < afirmado.valor + meio;
  }

  // ---------- Veredito ----------
  function julgar(afirmacao, evidencia, score) {
    const na = extrairNumeros(afirmacao);
    const nf = extrairNumeros(evidencia);
    if (na.length > 0) {
      // Sem números na evidência, não dá para confirmar nem refutar
      if (nf.length === 0) return "sem evidência suficiente";
      const todos = na.every(v => nf.some(n => numeroBate(v, n)));
      return todos ? "apoiada" : "refutada";
    }
    // Sem números: só aceita se quase todas as palavras batem
    return score >= 0.8 ? "apoiada" : "sem evidência suficiente";
  }

  function escorar(afirmacao, texto) {
    const ta = tokens(afirmacao);
    if (ta.size === 0) return 0;
    const tt = tokens(texto);
    let comum = 0;
    for (const t of ta) if (tt.has(t)) comum++;
    return comum / ta.size;
  }

  // ---------- Etapa 1: base local ----------
  function verificarLocal(afirmacao) {
    let melhor = null, melhorScore = 0;
    for (const fato of BASE) {
      const score = escorar(afirmacao, fato);
      if (score > melhorScore) { melhor = fato; melhorScore = score; }
    }
    if (!melhor || melhorScore < 0.5) return null;
    return { veredito: julgar(afirmacao, melhor, melhorScore), frase: melhor, score: melhorScore, fonte: "base local" };
  }

  // ---------- Etapa 2: Wikipédia ----------
  const CAPITAL = /^\p{Lu}/u;

  function consultasDeBusca(afirmacao) {
    const palavras = afirmacao.replace(/[.,!?;:()"“”]/g, " ").split(/\s+/).filter(p => p);
    const conteudo = palavras.filter(p => !STOPWORDS.has(normalizar(p)));
    const consultas = [conteudo.slice(0, 6).join(" ")];
    // Nomes próprios (exceto a primeira palavra da frase) costumam ser o tema central
    const proprios = palavras.filter((p, i) => i > 0 && CAPITAL.test(p));
    if (proprios.length) consultas.push(proprios.join(" "));
    return [...new Set(consultas)].filter(q => q.length > 1);
  }

  async function chamarWiki(params) {
    const url = new URL(WIKI_API);
    Object.entries({ format: "json", origin: "*", ...params }).forEach(([k, v]) => url.searchParams.set(k, v));
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  async function pesquisarWiki(consulta) {
    const j = await chamarWiki({ action: "query", list: "search", srsearch: consulta, srlimit: 3 });
    return (j.query?.search || []).map(x => x.title);
  }

  async function baixarTextoWiki(titulo) {
    // Um título por vez: extratos completos não aceitam vários títulos juntos
    const j = await chamarWiki({ action: "query", prop: "extracts", explaintext: 1, redirects: 1, titles: titulo });
    const paginas = Object.values(j.query?.pages || {});
    return paginas.filter(p => p.extract).map(p => ({ titulo: p.title, texto: p.extract }));
  }

  function melhorFrase(afirmacao, textos) {
    let melhor = null;
    for (const { titulo, texto } of textos) {
      const frases = texto.split(/(?<=[.!?])\s+|\n+/)
        .map(f => f.trim())
        .filter(f => f.length > 20 && f.length < 400);
      for (const f of frases) {
        // A frase precisa ter pelo menos algum termo da afirmação...
        const scoreFrase = escorar(afirmacao, f);
        if (scoreFrase < 0.2) continue;
        // ...mas a escolha considera também o título do artigo ("São Paulo (cidade)")
        const score = escorar(afirmacao, titulo + " " + f);
        if (!melhor || score > melhor.score) melhor = { frase: f, score, scoreFrase, titulo };
      }
    }
    return melhor;
  }

  async function verificarWikipedia(afirmacao) {
    let titulos = [];
    for (const consulta of consultasDeBusca(afirmacao)) {
      titulos = await pesquisarWiki(consulta);
      if (titulos.length) break;
    }
    if (titulos.length === 0) {
      return { veredito: "sem evidência suficiente", fonte: "Wikipédia", motivo: "nenhum artigo encontrado" };
    }
    const textos = (await Promise.all(titulos.map(baixarTextoWiki))).flat();
    const melhor = melhorFrase(afirmacao, textos);
    if (!melhor || melhor.score < 0.5) {
      return { veredito: "sem evidência suficiente", fonte: "Wikipédia", motivo: "nenhuma frase parecida nos artigos" };
    }
    return {
      veredito: julgar(afirmacao, melhor.frase, melhor.scoreFrase),
      frase: melhor.frase,
      score: melhor.scoreFrase,
      fonte: "Wikipédia",
      titulo: melhor.titulo,
      url: WIKI_PAGINA + encodeURIComponent(melhor.titulo.replace(/ /g, "_"))
    };
  }

  // ---------- Pipeline: base local primeiro, depois Wikipédia ----------
  async function verificarQualquer(afirmacao) {
    const local = verificarLocal(afirmacao);
    if (local && local.veredito !== "sem evidência suficiente") return local;
    try {
      return await verificarWikipedia(afirmacao);
    } catch (e) {
      return { veredito: "sem evidência suficiente", fonte: "Wikipédia", erro: true };
    }
  }

  // ---------- Interface ----------
  const resultadoEl = document.getElementById("resultado");
  const inputEl = document.getElementById("afirmacao");
  const botaoEl = document.getElementById("botao");

  function escapar(t) {
    return t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderizar(r) {
    const classe = r.veredito === "apoiada" ? "apoiada"
                 : r.veredito === "refutada" ? "refutada" : "sem";
    let html = `<span class="veredito ${classe}">${r.veredito.toUpperCase()}</span>`;

    if (r.frase) {
      const fonte = r.url
        ? `Wikipédia: <a href="${r.url}" target="_blank" rel="noopener">${escapar(r.titulo)}</a>`
        : "base local";
      html += `<div class="detalhe"><strong>Evidência</strong> (${fonte}, semelhança ${r.score.toFixed(2).replace(".", ",")}):<br>${escapar(r.frase)}</div>`;
      if (r.url) {
        html += `<div class="aviso">A checagem é automática: confira a frase na fonte antes de concluir.</div>`;
      }
    } else if (r.erro) {
      html += `<div class="detalhe">Não consegui consultar a Wikipédia. Verifique a conexão e tente de novo.</div>`;
    } else if (r.motivo) {
      html += `<div class="detalhe">Consultei a Wikipédia, mas ${r.motivo}. Nenhuma evidência confiável para esta afirmação.</div>`;
    } else {
      html += `<div class="detalhe">Nenhuma evidência encontrada para esta afirmação.</div>`;
    }
    resultadoEl.innerHTML = html;
  }

  async function mostrar(afirmacao) {
    botaoEl.disabled = true;
    resultadoEl.innerHTML = `<p class="vazio">Consultando as evidências…</p>`;
    try {
      renderizar(await verificarQualquer(afirmacao));
    } finally {
      botaoEl.disabled = false;
    }
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const texto = inputEl.value.trim();
    if (texto) mostrar(texto);
  });

  const exemplosEl = document.getElementById("exemplos");
  EXEMPLOS.forEach(ex => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = ex;
    b.addEventListener("click", () => {
      inputEl.value = ex;
      mostrar(ex);
    });
    exemplosEl.appendChild(b);
  });

  const baseEl = document.getElementById("base");
  BASE.forEach(f => {
    const li = document.createElement("li");
    li.textContent = f;
    baseEl.appendChild(li);
  });
</script>
</body>
</html>
